server:
  port: 8088

# mybatis相关统一配置
mybatis-plus:
  configuration:
    # 开启下划线转驼峰
    map-underscore-to-camel-case: true
    # 配置MyBatis-plus日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 设置统一的主键生成策略
      id-type: auto

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    druid:
      driver-class-name: ${jobpilot.datasource.driver-class-name}
      url: jdbc:mysql://${jobpilot.datasource.host}:${jobpilot.datasource.port}/${jobpilot.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${jobpilot.datasource.username}
      password: ${jobpilot.datasource.password}
  redis:
    host: ${jobpilot.redis.host}
    port: ${jobpilot.redis.port}
    password: ${jobpilot.redis.password}
    database: ${jobpilot.redis.database}
  # 邮件配置
  mail:
    # 邮件服务器地址
    host: smtp.qq.com
    # 你的邮箱地址
    username: ${JOBPILOT_MAIL_USERNAME:}
    # 授权码
    password: ${JOBPILOT_MAIL_PASSWORD:}
    # 编码格式
    default-encoding: UTF-8
    # 协议
    protocol: smtp
    port: 465
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
            required: true
  # 上传文件配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# 本地上传地址
file:
  resume-folder: ${JOBPILOT_RESUME_FOLDER:uploads/resumes}

security:
  jwt:
    secret: ${JOBPILOT_JWT_SECRET:change-this-development-secret-at-least-32-characters}
    expiration-seconds: ${JOBPILOT_JWT_EXPIRATION:86400}

ai:
  service:
    url: ${JOBPILOT_AI_URL:http://localhost:8000}
    internal-key: ${AI_INTERNAL_API_KEY:change-me}
    timeout-seconds: ${JOBPILOT_AI_TIMEOUT:60}

app:
  cors:
    allowed-origins: ${JOBPILOT_CORS_ORIGINS:http://localhost:8080,http://localhost:3000}
